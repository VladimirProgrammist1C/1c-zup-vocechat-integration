name: build-cfe

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build cfe
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\scripts\build-release.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          exit 0

      - name: Show artifact
        shell: powershell
        run: |
          Get-ChildItem "E:\DEV_LOCAL\BUILD\cfe-build\out\*.cfe" | Select-Object Name, Length, LastWriteTime

      - name: Upload to Gitea Release
        shell: powershell
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $tag  = $env:GITHUB_REF_NAME
          $repo = "admin/1c-zup-vocechat-integration"
          $api  = "http://localhost:3003/api/v1"
          $hdr  = @{ Authorization = "token $env:RELEASE_TOKEN" }
          $cfe  = Get-ChildItem "E:\DEV_LOCAL\BUILD\cfe-build\out\*.cfe" | Select-Object -First 1
          $ver  = $cfe.BaseName -replace '^.*?(\d+\.\d+\.\d+\.\d+)$','$1'
          $name = "VoiceChatIntegration-$ver.cfe"

          try {
            $rel = Invoke-RestMethod -Uri "$api/repos/$repo/releases/tags/$tag" -Headers $hdr
          } catch {
            $body = @{ tag_name = $tag; name = "Release $tag"; body = "CI autobuild" } | ConvertTo-Json -Compress
            $rel = Invoke-RestMethod -Uri "$api/repos/$repo/releases" -Method Post -Headers $hdr -ContentType "application/json" -Body $body
          }

          foreach ($a in @(Invoke-RestMethod -Uri "$api/repos/$repo/releases/$($rel.id)/assets" -Headers $hdr)) {
            if ($a.name -like "*.cfe") {
              Invoke-RestMethod -Uri "$api/repos/$repo/releases/$($rel.id)/assets/$($a.id)" -Method Delete -Headers $hdr
            }
          }

          curl.exe -s -S -H "Authorization: token $env:RELEASE_TOKEN" -F "attachment=@$($cfe.FullName);filename=$name" "$api/repos/$repo/releases/$($rel.id)/assets"
          if ($LASTEXITCODE -ne 0) { throw "gitea upload failed with code $LASTEXITCODE" }
          Write-Host "Gitea: $name attached to release $tag"

      - name: Upload to GitHub Release
        shell: powershell
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          $tag  = $env:GITHUB_REF_NAME
          $repo = "VladimirProgrammist1C/1c-zup-vocechat-integration"
          $api  = "https://api.github.com/repos/$repo"
          $hdr  = @{ Authorization = "token $env:GH_RELEASE_TOKEN"; Accept = "application/vnd.github+json" }
          $cfe  = Get-ChildItem "E:\DEV_LOCAL\BUILD\cfe-build\out\*.cfe" | Select-Object -First 1
          $ver  = $cfe.BaseName -replace '^.*?(\d+\.\d+\.\d+\.\d+)$','$1'
          $name = "VoiceChatIntegration-$ver.cfe"

          try {
            $rel = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Headers $hdr
          } catch {
            $body = @{ tag_name = $tag; name = "Release $tag"; body = "CI autobuild" } | ConvertTo-Json -Compress
            $rel = Invoke-RestMethod -Uri "$api/releases" -Method Post -Headers $hdr -ContentType "application/json" -Body $body
          }

          foreach ($a in @($rel.assets)) {
            if ($a.name -like "*.cfe") {
              Invoke-RestMethod -Uri "$api/releases/assets/$($a.id)" -Method Delete -Headers $hdr
            }
          }

          $uploadUrl = ($rel.upload_url -replace '\{.*\}', '') + "?name=$name"
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $hdr -ContentType "application/octet-stream" -InFile $cfe.FullName
          Write-Host "GitHub: $name attached to release $tag"